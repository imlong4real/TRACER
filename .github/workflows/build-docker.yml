name: Build Docker

on:
  push:
    branches: [main]
  workflow_dispatch: 

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/imlong4real/tracer
          # Tag every build with its (slash-sanitized) branch name,
          # e.g. tracer:insitucnv-tracer-degradation
          #
          # :latest must be stated explicitly. `flavor: latest=auto` does NOT
          # apply it on the default branch -- it only fires for semver/match
          # tag patterns (type=semver, type=match), and this workflow has
          # none. With latest=auto alone, main pushes tagged :main and :latest
          # was never updated, so it silently froze at the last pre-e13aaa0
          # build and then took whatever a branch dispatch running older YAML
          # happened to push.
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
          # Belt and braces: nothing should infer :latest implicitly.
          flavor: |
            latest=false

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
