name: Build Docker

on:
  push:
    branches: [main]
  workflow_dispatch: 

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/imlong4real/tracer
          # Tag every build with its (slash-sanitized) branch name,
          # e.g. tracer:insitucnv-tracer-degradation
          tags: |
            type=ref,event=branch
          # latest=auto -> the :latest tag is applied ONLY on the default
          # branch (main), so branch builds never clobber :latest.
          flavor: |
            latest=auto

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
