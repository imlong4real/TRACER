# CosMx (NanoString / Bruker) platform preset.
#
# Layered on top of `defaults.toml` via:
#   load_config(platform="cosmx")
#
# Units: read before running a raw flat file
# ------------------------------------------
# CosMx flat files give `x_global_px` / `y_global_px` in PIXELS and `z` as a
# z-plane INDEX, while every TRACER threshold is in microns. Declare both for
# that input, with the calibration of YOUR run (instrument documentation or
# run metadata):
#   --xy-units px --um-per-px <um/px> --z-units plane --z-step-um <um>
# or the same keys under [coordinates] in a user TOML. This preset sets
# neither: pixel size and z-step differ across instruments and acquisitions,
# and TRACER never infers them from the platform name. Tables that are
# already in microns (e.g. the benchmark ROIs) need no declaration.
#
# z-bin
# -----
# CosMx images DISCRETE z-planes. Once z is in microns, `g_z_um = "auto"`
# sets the z-bin to the observed plane spacing, so consecutive planes sit
# exactly one bin apart and connect at `z_neighbor_depth = 1`. On the NSCLC
# benchmark ROI (11 planes, 0.8 µm apart) it resolves to 0.8 µm, the value
# this preset used to hard-code. A fixed 0.8 is wrong for an acquisition
# with another z-step: smaller than the spacing and adjacent planes stop
# connecting, larger and planes merge. "auto" only MEASURES spacing in
# micron data; it does not convert plane indices, which is why they must be
# declared above. An explicit --g-z-um or user-config value still wins.

[bootstrap]
# CosMx exports an `overlaps_nucleus`-equivalent flag; restrict the PMI
# panel to nucleus-overlapping tx (most reliable assignment).
nuclear_only = true
nucleus_col = "overlaps_nucleus"

[stitch]
# Discrete planes: bin at the measured plane spacing. See header.
g_z_um = "auto"
